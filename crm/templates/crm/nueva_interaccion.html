{% extends 'crm/base.html' %}
{% block title %}Nueva interacción | CRM{% endblock %}
{% block content %}<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl border"><h2 class="text-2xl font-bold mb-5">Nueva interacción</h2><form method="post" class="space-y-4">{% csrf_token %}{% for field in form %}<div><label class="block text-sm font-medium mb-1">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="text-red-600 text-sm">{{ error }}</p>{% endfor %}</div>{% endfor %}<div class="flex justify-end gap-3"><a href="{% if cliente_preseleccionado %}{% url 'detalle_cliente' cliente_preseleccionado.id %}{% else %}{% url 'clientes' %}{% endif %}">Cancelar</a><button class="px-4 py-2 bg-brand-coral text-white rounded-lg">Guardar interacción</button></div></form></div>{% endblock %}
