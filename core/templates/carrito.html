{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | El Camarón Crudo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}"><img src="{% static 'img/Logo.jpeg' %}" alt="El Camarón Crudo" height="45" width="45"> El Camarón Crudo</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'productos' %}">Productos</a>
                <a class="nav-link active" href="{% url 'carrito' %}"><i class="bi bi-cart3"></i> Carrito <span class="badge rounded-pill text-bg-light" data-cart-count>0</span></a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-4">Tu carrito</h1>
        <div class="row g-4">
            <section class="col-lg-8" id="lista-carrito" aria-live="polite"></section>
            <aside class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="h4">Resumen del pedido</h2>
                        <div class="d-flex justify-content-between mt-3"><span>Subtotal</span><strong id="cart-subtotal">$0.00</strong></div>
                        <div class="d-flex justify-content-between mt-2"><span>Envío</span><span>Por confirmar</span></div>
                        <hr>
                        <div class="d-flex justify-content-between fs-5"><strong>Total</strong><strong id="cart-total">$0.00</strong></div>
                        <a id="checkout-button" href="{% url 'pago' %}" class="btn btn-danger w-100 mt-4">Continuar al pago</a>
                        <a href="{% url 'productos' %}" class="btn btn-outline-secondary w-100 mt-2">Seguir comprando</a>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <script src="{% static 'js/cart.js' %}"></script>
</body>
</html>
