{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | El Camarón Crudo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h2 text-center mb-4">Iniciar sesión</h1>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input id="usuario" name="usuario" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input id="contrasena" name="contrasena" type="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-danger w-100">Entrar</button>
                </form>
                <p class="text-center mt-3 mb-0"><a href="{% url 'registro' %}">Crear una cuenta</a></p>
            </div>
        </div>
    </main>
</body>
</html>
